<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of merchandise order and ticket sales documents.">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>Documents</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #f7f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { width: min(100%, 720px); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -.03em; }
    p { margin: 0 0 24px; color: #5f6368; line-height: 1.5; }
    .files { display: grid; gap: 12px; }
    .file { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid #e1e4e8; border-radius: 12px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 1px 2px #2021240a; transition: border-color .15s, box-shadow .15s, transform .15s; }
    .file:hover, .file:focus-visible { border-color: #8ab4f8; box-shadow: 0 3px 12px #20212414; transform: translateY(-1px); outline: none; }
    .icon { display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center; border-radius: 10px; background: #eef3fd; font-size: 21px; }
    .name { min-width: 0; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
    .arrow { margin-left: auto; color: #5f6368; font-size: 20px; }
    footer { margin-top: 20px; color: #777; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Documents</h1>
    <p>Choose a file below to view or download it.</p>
    <nav class="files" aria-label="Documents">
      <a class="file" href="1%20Proof%20of%20Merchandise%20Order%20October%2024%202025.png">
        <span class="icon" aria-hidden="true">🖼️</span>
        <span class="name">1 Proof of Merchandise Order October 24 2025.png</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="file" href="2a-flyers.png">
        <span class="icon" aria-hidden="true">📄</span>
        <span class="name">2a Sister Mary Celine - Flyers</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
       <a class="file" href="2b-stickers.png">
        <span class="icon" aria-hidden="true">📄</span>
        <span class="name">2b Sister Mary Celine - Stickers</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="file" href="3%20Ticket%20Sales%20Comparison%20Feb%2011%202026.png">
        <span class="icon" aria-hidden="true">🖼️</span>
        <span class="name">3 Ticket Sales Comparison Feb 11 2026.png</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>

  </main>
</body>
</html>
